name: Build & Publish Custom Ghost Docker Image

on:
  push:
    branches: [ "pb-custom" ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate the image on the same typecheck/unit targets upstream CI uses, so a
      # bad rebase or conflict resolution cannot be published and deployed.
      - name: Typecheck Ghost
        timeout-minutes: 20
        run: pnpm nx run ghost:test:types
        env:
          FORCE_COLOR: 0
          NX_SKIP_LOG_GROUPING: true
          TZ: America/New_York

      - name: Unit tests
        timeout-minutes: 30
        run: |
          # Vitest occasionally crashes a worker on loaded runners; upstream
          # retries up to 3 times. Nx caches anything that already passed.
          for attempt in 1 2 3; do
            if timeout 25m pnpm nx run ghost:test:unit; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::Unit tests attempt ${attempt} failed — retrying"
            fi
          done
          echo "::error::Unit tests failed after 3 attempts"
          exit 1
        env:
          FORCE_COLOR: 0
          NX_SKIP_LOG_GROUPING: true
          logging__level: fatal
          TZ: America/New_York

      - name: Build Admin Panel Assets
        run: pnpm nx run @tryghost/admin:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          target: full
          push: true
          # Always re-resolve the floating Node base tag (node:24-bookworm-slim)
          # so each build picks up the latest 24.x patch release.
          pull: true
          # sha-<commit> is an immutable tag, so the update script can verify
          # that the image for the exact commit it pushed exists in GHCR.
          tags: |
            ghcr.io/paulbaumgart/ghost:latest
            ghcr.io/paulbaumgart/ghost:pb-custom
            ghcr.io/paulbaumgart/ghost:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
